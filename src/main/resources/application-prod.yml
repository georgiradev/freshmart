spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: WARN
    com.jtspringproject: INFO
    org.springframework.security: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{30} - %msg%n"
