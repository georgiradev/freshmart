<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fff8e1" rx="12"/>
  <!-- Left whole egg -->
  <ellipse cx="118" cy="110" rx="30" ry="38" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <ellipse cx="118" cy="118" rx="22" ry="28" fill="#ffecb3"/>
  <!-- Middle egg (cracked) -->
  <ellipse cx="175" cy="108" rx="32" ry="40" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <!-- Crack line -->
  <polyline points="163,92 168,100 162,106 170,112" stroke="#f57f17" stroke-width="2" fill="none"/>
  <ellipse cx="175" cy="117" rx="23" ry="29" fill="#ffecb3"/>
  <!-- Right egg (broken - yolk showing) -->
  <!-- Shell halves -->
  <path d="M215 88 C215 70 248 70 248 90 L244 108 L219 108 Z" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <path d="M206 95 C204 76 237 72 237 92 L231 108 L210 108 Z" fill="#ffecb3" stroke="#f9a825" stroke-width="1.5"/>
  <!-- Yolk -->
  <ellipse cx="228" cy="130" rx="22" ry="18" fill="rgba(255,200,100,0.3)" stroke="#ffb300" stroke-width="1"/>
  <circle cx="228" cy="128" r="14" fill="#ffb300"/>
  <circle cx="228" cy="128" r="10" fill="#ffd54f"/>
  <circle cx="224" cy="124" r="3" fill="rgba(255,255,255,0.5)"/>
  <rect x="50" y="175" width="220" height="36" rx="8" fill="#f57f17"/>
  <text x="160" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="white">Cracked Eggs</text>
</svg>
