<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fce4ec" rx="12"/>
  <!-- Jar body -->
  <rect x="118" y="72" width="84" height="88" rx="10" fill="rgba(255,200,210,0.5)" stroke="#f48fb1" stroke-width="2"/>
  <!-- Jar lid -->
  <rect x="114" y="58" width="92" height="20" rx="8" fill="#ec407a"/>
  <!-- Salt crystals inside -->
  <rect x="126" y="100" width="68" height="56" rx="6" fill="#f8bbd0" opacity="0.8"/>
  <!-- Crystal shapes -->
  <rect x="134" y="112" width="8" height="8" rx="1" fill="#e91e63" opacity="0.6" transform="rotate(15,138,116)"/>
  <rect x="152" y="118" width="6" height="6" rx="1" fill="#e91e63" opacity="0.5" transform="rotate(-10,155,121)"/>
  <rect x="168" y="108" width="9" height="9" rx="1" fill="#e91e63" opacity="0.55" transform="rotate(25,172,112)"/>
  <rect x="140" y="132" width="7" height="7" rx="1" fill="#e91e63" opacity="0.5" transform="rotate(-5,143,135)"/>
  <rect x="162" y="128" width="8" height="8" rx="1" fill="#e91e63" opacity="0.6" transform="rotate(20,166,132)"/>
  <!-- Highlight on jar -->
  <rect x="124" y="78" width="6" height="60" rx="3" fill="rgba(255,255,255,0.5)"/>
  <!-- Label on jar -->
  <rect x="124" y="90" width="72" height="22" rx="4" fill="white" opacity="0.7"/>
  <text x="160" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#c2185b" font-weight="bold">HIMALAYAN</text>
</svg>
