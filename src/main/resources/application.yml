spring:
  config:
    import: "optional:classpath:products.yml"

  # H2 In-Memory DataSource (local dev)
  datasource:
    url: jdbc:h2:mem:ecommjava;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console — http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # MVC / JSP
  mvc:
    view:
      prefix: /views/
      suffix: .jsp

  # File uploads + Encoding
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
    encoding:
      charset: UTF-8
      force: true

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.jtspringproject: DEBUG
    org.springframework.security: INFO
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
